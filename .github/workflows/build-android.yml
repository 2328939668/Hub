name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Install dependencies
      working-directory: ./decentralized-chat-app
      run: npm ci

    - name: Build web app
      working-directory: ./decentralized-chat-app
      run: npm run build

    - name: Sync to Android
      working-directory: ./decentralized-chat-app
      run: npx cap sync android

    - name: Build Debug APK
      working-directory: ./decentralized-chat-app/android
      run: ./gradlew assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: decentralized-chat-app/android/app/build/outputs/apk/debug/app-debug.apk
